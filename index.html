<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arise · Physical Improvement Tracker</title>
  <meta name="description" content="Daily home-workout quests with videos, a rest timer, levels, streaks and progress tracking.">
  <meta name="theme-color" content="#040507">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arise">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/BebasNeue-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/Rajdhani-600.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <nav id="tabs" aria-label="Main"></nav>
  <main id="app" aria-live="polite">
    <noscript><p>This app needs JavaScript turned on.</p></noscript>
  </main>
  <div id="restbar" role="timer" aria-live="off" hidden></div>
  <div id="sheet" hidden>
    <div class="sheet-backdrop" data-act="sheet-close"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Details">
      <div class="sheet-bar">
        <button class="icon-btn sheet-close" data-act="sheet-close" aria-label="Close">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</body>
</html>
