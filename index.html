<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only the app's own scripts run. connect-src stays open to https: because people can bring
       any AI service they like; script-src is what stops injected code. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://raw.githubusercontent.com https://i.ytimg.com; font-src 'self'; frame-src https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Arise</title>
  <meta name="description" content="Daily quests toward any goal, with an AI coach that keeps your data private.">
  <meta name="theme-color" content="#040507">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Arise">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="./icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script type="module" src="/src/main.ts"></script>
</head>
<body>
  <nav id="tabs" aria-label="Main"></nav>
  <main id="app" aria-live="polite">
    <noscript><p>This app needs JavaScript turned on.</p></noscript>
  </main>
  <div id="restbar" role="timer" aria-live="off" hidden></div>
  <div id="sheet" hidden>
    <div class="sheet-backdrop" data-act="sheet-close"></div>
    <div class="sheet-panel" role="dialog" aria-modal="true" aria-label="Details">
      <div class="sheet-bar">
        <button class="icon-btn sheet-close" data-act="sheet-close" aria-label="Close">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body"></div>
    </div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="importFile" accept="application/json,.json" hidden>
</body>
</html>
