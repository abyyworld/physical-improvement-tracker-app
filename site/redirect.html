<title>Arise has moved</title>
<meta name="robots" content="noindex">
<script>
  // Arise moved from /physical-improvement-tracker-app/ to /arise/ on the same site. The same path,
  // query and #part there (a shared goal's or a me link's key is in the #part).

    var rest = location.pathname.replace(/^\/physical-improvement-tracker-app(\/|$)/, '/');
    location.replace('/arise' + rest + location.search + location.hash);
  })();
</script>
