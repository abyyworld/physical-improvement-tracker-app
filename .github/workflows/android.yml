# Builds the optional Android app and puts Arise.apk on the "android-latest" release.
# Pull requests only build it, with read-only access, so a change that breaks the Android app shows
# up before it's merged; nothing is signed or published from them.
# The app is signed with the key in the repo's secrets (docs/LAUNCH.md, "Signing the Android app"),
# always the same one, so each new Arise.apk installs over the one before and keeps its data.
# Without the key it's still built, but not published.
# Most people should use the web app instead: it installs from the browser and updates itself.
name: Android app

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/native-key.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'android/**'
      - 'scripts/native-key.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install packages
        run: npm ci

      - name: Build the web app and copy it into the Android project
        run: |
          npm run build
          npx cap sync android

      # A new build number for every build: that's how the app knows a new Arise.apk was installed,
      # and starts from the copy of the web app inside it instead of one it downloaded earlier.
      - name: Build the app (not signed yet)
        working-directory: android
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PariseVersionCode=${{ github.run_number }} \
            -PariseVersionName="$(node -p "require('../package.json').version")"

      # Only for main, never for a pull request. The key is the same every time: Android only
      # installs an update signed with the same key as the app already on the phone.
      - name: Sign Arise.apk
        id: sign
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Arise.apk was built, but not published"
              echo
              echo "The repo has no signing key for the Android app yet, so there's nothing to install."
              echo "**The owner needs to add it once:** follow \"Signing the Android app\" in docs/LAUNCH.md"
              echo "(the secrets ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD)."
              echo "Then run this workflow again (Actions, Android app, Run workflow) or push to main."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning title=Android app not published::Add the signing key secrets (docs/LAUNCH.md, Signing the Android app)."
            exit 0
          fi
          export KEY_PASS="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          KS="$RUNNER_TEMP/arise-release.keystore"
          trap 'rm -f "$KS"' EXIT
          printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$KS"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:KEY_PASS \
            --out Arise.apk aligned.apk
          "$BT/apksigner" verify --print-certs Arise.apk | grep -i 'SHA-256 digest' | head -1
          sha256sum Arise.apk | tee Arise.apk.sha256
          echo "signed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Arise.apk is signed and ready to publish"
            echo
            echo "SHA-256: \`$(cut -d' ' -f1 Arise.apk.sha256)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say what a pull request build does
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "## The Android app builds"
            echo
            echo "Pull requests only check that Arise.apk builds. It's signed and published once this is merged into main."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: steps.sign.outputs.signed == 'true'
        with:
          name: Arise-apk
          path: |
            Arise.apk
            Arise.apk.sha256

  # Only this job can write to the repo, only for main, and only to publish the release.
  publish:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: Arise-apk

      - name: Record where this build came from
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: Arise.apk

      - name: Publish to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          NOTES="Built from ${GITHUB_SHA::7} on $(date -u '+%Y-%m-%d'). SHA-256: $(cut -d' ' -f1 Arise.apk.sha256). Open this page on your Android phone, tap Arise.apk, then open it and tap Install (or Update). Steps are in the README."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release edit android-latest --notes "$NOTES"
          else
            gh release create android-latest --title "Arise for Android" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload android-latest Arise.apk Arise.apk.sha256 --clobber
