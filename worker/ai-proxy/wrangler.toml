# Arise private AI proxy. Setup steps are in README.md next to this file.
name = "arise-ai"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Nothing about requests is kept: no request logs, no traces.
[observability]
enabled = false

[vars]
FIREBASE_PROJECT_ID = "arise-a7349"
# The website, the iPhone app (capacitor://localhost), the Android app (https://localhost) and development.
ALLOWED_ORIGINS = "https://abyyworld.github.io,capacitor://localhost,https://localhost,http://localhost:5173"
# Private AI questions a day: with Arise Private (fair use), and without it.
DAILY_LIMIT = "150"
PRIVATE_FREE_LIMIT = "5"
FREE_DAILY_LIMIT = "15"
# Arise Private's Lemon Squeezy settings are Worker secrets, so a deploy never clears them:
# LEMON_WEBHOOK_SECRET, LEMON_CHECKOUT_MONTHLY, LEMON_CHECKOUT_YEARLY, OWNER_UIDS and
# LEMON_TEST_UIDS (scripts/setup-workers.sh).

# Cloudflare Workers AI, for the free (less private) AI at /free/v1.
[ai]
binding = "AI"

# Short bursts: 20 requests a minute per account, 60 per IP address.
[[ratelimits]]
name = "PER_USER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PER_IP"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

# One tiny counter per account for the daily allowance, deleted at midnight UTC.
[[durable_objects.bindings]]
name = "QUOTA"
class_name = "Quota"

# One tiny record per account that has (or had) Arise Private: its status, until when, and the
# link to manage it. Deleted 30 days after the plan ends.
[[durable_objects.bindings]]
name = "PLAN"
class_name = "Plan"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Quota"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Plan"]
